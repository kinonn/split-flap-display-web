services:
  app:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    container_name: split-flap-web
    restart: unless-stopped
    ports:
      - "8100:8100"
    env_file:
      # app.conf is git-ignored; make it optional so `docker compose up`
      # works on a fresh clone (the backend falls back to built-in
      # defaults when no env vars are set). Requires Compose >= 2.24.
      - path: backend-go/app.conf
        required: false
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8100/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'